<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScript Greeting</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:15px;background:#f1f7ff;color:#223}button{padding:9px 15px;cursor:pointer;margin:5px}input,select{padding:8px;margin:5px}section{background:white;padding:20px;border-radius:8px;margin:15px 0}</style></head>
<body><h1>JavaScript Greeting</h1><button onclick="greet()">Enter Your Name</button><p id="result"></p><script>function greet(){const name=prompt("Enter your name:");if(name!==null)result.textContent=name.trim()?"Hello, "+name.trim()+"!":"Please enter your name."}</script></body></html>
