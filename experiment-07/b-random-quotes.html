<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Quote Generator</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:15px;background:#f1f7ff;color:#223}button{padding:9px 15px;cursor:pointer;margin:5px}input,select{padding:8px;margin:5px}section{background:white;padding:20px;border-radius:8px;margin:15px 0}</style></head>
<body><h1>Random Quote Generator</h1><section><button onclick="getQuote()">Get Random Quote</button><blockquote id="quote"></blockquote><p id="author"></p></section><script>async function getQuote(){const q=document.getElementById("quote"),a=document.getElementById("author");q.textContent="Loading...";a.textContent="";try{const r=await fetch("https://dummyjson.com/quotes/random");if(!r.ok)throw Error("API error");const data=await r.json();q.textContent="""+data.quote+""";a.textContent="— "+data.author;}catch(e){q.textContent="Unable to fetch quote. Check internet connection."}}</script></body></html>
