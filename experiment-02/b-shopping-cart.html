<!DOCTYPE html><html ng-app="shop"><head><meta charset="utf-8"><title>AngularJS Shopping Cart</title><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><style>body{font-family:Arial;margin:30px}table,td,th{border:1px solid;border-collapse:collapse;padding:8px}</style></head><body ng-controller="Cart"><h1>Shopping Cart</h1><section ng-repeat="cat in categories"><h3>{{cat.name}}</h3><label ng-repeat="p in cat.items" style="display:block"><input type="checkbox" ng-model="p.selected">{{p.name}} — Rs.{{p.price}}</label></section><button ng-click="submit()">Submit</button><div ng-if="submitted"><h2>Selected Products</h2><table><tr><th>Product</th><th>Price</th></tr><tr ng-repeat="p in cart"><td>{{p.name}}</td><td>Rs.{{p.price}}</td></tr><tr><th>Total</th><th>Rs.{{total}}</th></tr></table></div><script>angular.module('shop',[]).controller('Cart',function($scope){$scope.categories=[{name:'Electronics',items:[{name:'Mouse',price:500},{name:'Keyboard',price:1000}]},{name:'Groceries',items:[{name:'Rice',price:60},{name:'Sugar',price:50}]},{name:'Stationery',items:[{name:'Pen',price:10},{name:'Notebook',price:40}]}];$scope.submit=function(){$scope.cart=$scope.categories.flatMap(c=>c.items).filter(p=>p.selected);$scope.total=$scope.cart.reduce((t,p)=>t+p.price,0);$scope.submitted=true;};});</script></body></html>
