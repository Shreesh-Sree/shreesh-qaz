<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factorial Calculator</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:15px;background:#f1f7ff;color:#223}button{padding:9px 15px;cursor:pointer;margin:5px}input,select{padding:8px;margin:5px}section{background:white;padding:20px;border-radius:8px;margin:15px 0}</style></head>
<body><h1>Factorial Calculator</h1><button onclick="factorial()">Submit</button><p id="out"></p><script>function factorial(){const input=prompt("Enter a number:");if(input===null)return;const n=Number(input);if(!input.trim()||!Number.isInteger(n)||n<0||n>170){out.textContent="Enter an integer from 0 to 170";return}let f=1;for(let i=1;i<=n;i++)f*=i;out.textContent=`Factorial of ${n} = ${f}`}</script></body></html>
