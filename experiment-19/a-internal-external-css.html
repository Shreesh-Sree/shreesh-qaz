<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Internal and External CSS</title>
    <link rel="stylesheet" href="a-style.css" />
    <style>
      h1 {
        color: blue;
        font-size: 32px;
        text-align: center;
      }
      p {
        color: green;
        font-size: 20px;
        font-family: Arial;
      }
      .internal {
        background: lightyellow;
        padding: 20px;
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>CSS Styling Example</h1>
    <p>This paragraph uses Internal CSS.</p>
    <div class="internal">Internal CSS Background Example</div>
    <h2>External CSS Example</h2>
    <div class="external">This box uses External CSS.</div>
  </body>
</html>
