<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Basic CSS Styling</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
      body {
        background: lightblue;
        margin: 30px;
      }
      h2 {
        font: 32px Georgia;
        color: navy;
        text-align: center;
      }
      p {
        font: 18px Verdana;
        color: green;
        background: white;
        padding: 15px;
      }
      .box {
        background: lightyellow;
        margin: 20px;
        padding: 25px;
        border: 2px solid black;
      }
      button {
        background: blue;
        color: white;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Basic CSS Styling</h1>
    <h2>Welcome to CSS</h2>
    <p>CSS changes fonts, colors, margins and padding.</p>
    <section class="box">This box demonstrates margin and padding.</section>
    <button>Click Here</button>
    <script></script>
  </body>
</html>
