<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fibonacci Series Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>Fibonacci Series Generator</h1>
    <button onclick="fibonacci()">Submit</button>
    <p id="out"></p>
    <script>
      function fibonacci() {
        const input = prompt("Enter number of terms:");
        if (input === null) return;
        const n = Number(input);
        if (!input.trim() || !Number.isInteger(n) || n < 1 || n > 79) {
          out.textContent = "Enter terms from 1 to 79";
          return;
        }
        let a = 0,
          b = 1,
          s = [];
        for (let i = 0; i < n; i++) {
          s.push(a);
          const next = a + b;
          a = b;
          b = next;
        }
        out.textContent = "Fibonacci Series: " + s.join(", ");
      }
    </script>
  </body>
</html>
