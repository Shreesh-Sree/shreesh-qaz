<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JavaScript Quiz</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>JavaScript Quiz</h1>
    <section>
      <h2 id="question"></h2>
      <div id="options"></div>
      <p id="feedback"></p>
      <button id="button" onclick="submitAnswer()">Submit</button>
    </section>
    <script>
      const questions = [
        {
          q: "What does HTML stand for?",
          o: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyper Tool Markup Language",
            "Home Text Markup Language",
          ],
          a: 0,
        },
        {
          q: "Which language is used for styling?",
          o: ["HTML", "CSS", "Java", "Python"],
          a: 1,
        },
        {
          q: "Which keyword declares a variable?",
          o: ["print", "if", "let", "return"],
          a: 2,
        },
      ];
      let index = 0,
        score = 0,
        answered = false;
      function load() {
        const q = questions[index];
        question.textContent = q.q;
        options.innerHTML = q.o
          .map(
            (o, i) =>
              `<label style="display:block"><input name="answer" type="radio" value="${i}">${o}</label>`,
          )
          .join("");
        feedback.textContent = "";
        button.textContent = "Submit";
        answered = false;
      }
      function submitAnswer() {
        if (answered) {
          index++;
          if (index === questions.length) {
            question.textContent = "Quiz Completed!";
            options.innerHTML = "";
            feedback.textContent = `Score: ${score}/${questions.length}`;
            button.hidden = true;
          } else load();
          return;
        }
        const selected = document.querySelector('input[name="answer"]:checked');
        if (!selected) {
          alert("Select an answer");
          return;
        }
        const correct = Number(selected.value) === questions[index].a;
        if (correct) score++;
        feedback.textContent = correct
          ? "Correct Answer!"
          : "Incorrect Answer! Correct: " +
            questions[index].o[questions[index].a];
        feedback.style.color = correct ? "green" : "red";
        document
          .querySelectorAll('input[name="answer"]')
          .forEach((e) => (e.disabled = true));
        answered = true;
        button.textContent = "Next";
      }
      load();
    </script>
  </body>
</html>
