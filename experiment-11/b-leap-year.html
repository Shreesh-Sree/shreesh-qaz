<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leap Year Checker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>Leap Year Checker</h1>
    <input id="year" type="number" min="1" step="1" /><button onclick="check()">
      Check
    </button>
    <p id="result"></p>
    <script>
      function check() {
        const raw = year.value,
          n = Number(raw);
        result.textContent =
          !raw || !Number.isInteger(n) || n < 1
            ? "Enter a valid year"
            : n % 400 === 0 || (n % 4 === 0 && n % 100 !== 0)
              ? "Leap Year"
              : "Not a Leap Year";
      }
    </script>
  </body>
</html>
