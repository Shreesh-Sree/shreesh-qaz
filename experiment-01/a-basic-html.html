<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Basic HTML Elements</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>Basic HTML Elements</h1>
    <h2>Headings and Paragraphs</h2>
    <p>
      This is a paragraph with <b>bold</b>, <i>italic</i>, <u>underline</u>,
      <strong>strong</strong>, <em>emphasis</em>, <mark>mark</mark> and
      <code>code</code>.
    </p>
    <hr />
    <h3>Lists</h3>
    <ol>
      <li>HTML</li>
      <li>CSS</li>
    </ol>
    <ul>
      <li>JavaScript</li>
      <li>AngularJS</li>
    </ul>
    <h3>Table</h3>
    <table border="1" cellpadding="8">
      <tr>
        <th>Name</th>
        <th>Subject</th>
      </tr>
      <tr>
        <td>Arun</td>
        <td>HTML</td>
      </tr>
    </table>
    <h3>Image and Link</h3>
    <img src="https://placehold.co/200x100" alt="Placeholder image" />
    <p><a href="https://developer.mozilla.org/">Learn HTML</a></p>
    <form>
      <label>Name <input required /></label
      ><label>Email <input type="email" required /></label
      ><label><input type="checkbox" />Agree</label><button>Submit</button>
    </form>
    <script></script>
  </body>
</html>
