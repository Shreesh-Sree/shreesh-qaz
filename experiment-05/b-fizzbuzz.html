<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FizzBuzz 1 to 100</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:15px;background:#f1f7ff;color:#223}button{padding:9px 15px;cursor:pointer;margin:5px}input,select{padding:8px;margin:5px}section{background:white;padding:20px;border-radius:8px;margin:15px 0}</style></head>
<body><h1>FizzBuzz 1 to 100</h1><div id="out"></div><script>let out=[];for(let i=1;i<=100;i++)out.push(i%15===0?"FizzBuzz":i%3===0?"Fizz":i%5===0?"Buzz":i);document.getElementById("out").innerHTML=out.join("<br>");</script></body></html>
