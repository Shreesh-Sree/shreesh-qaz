<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Favorite Fruits</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:15px;background:#f1f7ff;color:#223}button{padding:9px 15px;cursor:pointer;margin:5px}input,select{padding:8px;margin:5px}section{background:white;padding:20px;border-radius:8px;margin:15px 0}</style></head>
<body><h1>My Favorite Fruits</h1><div id="out"></div><script>const fruits=["Apple","Banana","Mango","Orange","Grapes"];for(let i=0;i<fruits.length;i++){const p=document.createElement("p");p.textContent=fruits[i];out.append(p)}</script></body></html>
