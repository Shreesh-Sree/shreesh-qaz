<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Required Fields Validation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>Required Fields Validation</h1>
    <form onsubmit="return validate();">
      <p><input id="name" placeholder="Name" /></p>
      <p><input id="email" type="email" placeholder="Email" /></p>
      <p><input id="password" type="password" placeholder="Password" /></p>
      <button>Submit</button>
    </form>
    <p id="result"></p>
    <script>
      function validate() {
        result.textContent =
          !document.getElementById("name").value.trim() ||
          !document.getElementById("email").value.trim() ||
          !document.getElementById("password").value.trim()
            ? "All fields are required!"
            : "Form Submitted Successfully!";
        return false;
      }
    </script>
  </body>
</html>
