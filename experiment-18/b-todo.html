<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My To-Do List</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>My To-Do List</h1>
    <section>
      <input id="task" placeholder="Enter a task" /><button onclick="addTask()">
        Add
      </button>
      <ul id="list"></ul>
    </section>
    <script>
      function addTask() {
        const value = task.value.trim();
        if (!value) {
          alert("Enter a task");
          return;
        }
        const li = document.createElement("li"),
          cb = document.createElement("input"),
          label = document.createElement("span"),
          del = document.createElement("button");
        cb.type = "checkbox";
        label.textContent = value;
        cb.onchange = () => {
          label.style.textDecoration = cb.checked ? "line-through" : "none";
        };
        del.textContent = "Delete";
        del.onclick = () => li.remove();
        li.append(cb, label, del);
        list.append(li);
        task.value = "";
      }
    </script>
  </body>
</html>
