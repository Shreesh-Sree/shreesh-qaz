<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Password Strength Checker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>Password Strength Checker</h1>
    <button onclick="check()">Check Password</button>
    <p id="out"></p>
    <script>
      function check() {
        const p = prompt("Enter your password:");
        if (p === null) return;
        out.textContent =
          p.length >= 8 && /[0-9]/.test(p) && /[^a-zA-Z0-9]/.test(p)
            ? "Strong Password"
            : "Weak Password";
      }
    </script>
  </body>
</html>
