<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DHTML Form Validation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 850px;
        margin: 35px auto;
        padding: 15px;
        background: #f1f7ff;
        color: #223;
      }
      button {
        padding: 9px 15px;
        cursor: pointer;
        margin: 5px;
      }
      input,
      select {
        padding: 8px;
        margin: 5px;
      }
      section {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <h1>DHTML Form Validation</h1>
    <form onsubmit="return validate();">
      <p><input id="name" placeholder="Name" /></p>
      <p><input id="email" placeholder="Email" /></p>
      <p><input id="password" type="password" placeholder="Password" /></p>
      <p><input id="mobile" placeholder="Mobile" /></p>
      <button>Submit</button>
    </form>
    <p id="result"></p>
    <script>
      function validate() {
        let n = document.getElementById("name").value.trim(),
          e = document.getElementById("email").value.trim(),
          p = document.getElementById("password").value,
          m = document.getElementById("mobile").value.trim(),
          msg = "";
        if (!n || !e || !p || !m) msg = "All fields required";
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) msg = "Invalid email";
        else if (p.length < 6) msg = "Password must have at least 6 characters";
        else if (!/^\d{10}$/.test(m)) msg = "Mobile must have 10 digits";
        else msg = "Form Submitted Successfully";
        result.textContent = msg;
        return false;
      }
    </script>
  </body>
</html>
